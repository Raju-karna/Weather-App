<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="weather-app">
    <h1><strong>Weather App</strong></h1>
    <div class="input-container">
      <input type="text" id="city-input" placeholder="Enter city name">
      <button id="search-button"><strong>Get Weather</strong></button>
    </div>
    <div id="weather-result">
      <!-- Weather details will appear here after the user clicks the "Get Weather" button -->
    </div>
  </div>

  <!-- Name in the corner -->
  <p class="corner-name"><strong>Raju Karna</strong></p>

  <script src="script.js"></script>
</body>
</html>
